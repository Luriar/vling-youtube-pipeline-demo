<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fictional Research Dashboard</title>
<style>
body{margin:0;font:16px system-ui,"Malgun Gothic",sans-serif;background:#f5f7fa;color:#222}
header{background:white;border-bottom:1px solid #ddd}.wrap{max-width:1100px;margin:auto;padding:22px}
nav{display:flex;justify-content:space-between;align-items:center;gap:14px}a{color:#225580}
a+a{margin-left:16px}.hint{padding:15px;background:#fff9e9;border:1px solid #e9d7a0;border-radius:8px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.stat{padding:14px 22px;background:#fff;border:1px solid #ddd;border-radius:8px}
.stat strong{display:block;font-size:24px}.tablebox{background:white;overflow-x:auto;border-radius:8px}
table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd}
th{background:#edf1f6}input{padding:8px;border:1px solid #bbb;border-radius:5px;width:170px}
button{background:#225580;border:0;padding:8px;color:white;border-radius:5px}small{color:#777}
</style></head>
<body><header><div class="wrap"><nav><strong>Synthetic Research Dashboard</strong>
<div><a href="/">채널</a><a href="/videos">영상</a><a href="/api/summary">JSON 통계</a></div>
</nav></div></header><main class="wrap"><h1>{% block title %}{% endblock %}</h1>
<div class="hint">회사 또는 실제 서비스 자료가 아닌 독립 재구현 및 가상 데이터입니다. 외부 크롤링을 하지 않습니다.</div>
<div class="stats">
<div class="stat">채널<strong>{{ stats.channels }}</strong></div>
<div class="stat">영상<strong>{{ stats.videos }}</strong></div>
<div class="stat">적재 실행<strong>{{ stats.runs }}</strong></div>
</div>{% block body %}{% endblock %}</main></body></html>
